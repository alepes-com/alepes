# DuckDB-on-Bun certification matrix.
#
# Runs the 12-point certification harness for @duckdb/node-api under the
# pinned Bun 1.4 on the platforms Alepes supports. The harness includes the
# intermittent native-addon segfault class Bun's own CI flagged, so a green
# run here is the evidence gate for the analytics backend decision.
#
# This workflow is the durable form of the certification recorded locally at
# packages/analytics/test/certify-duckdb-bun.ts — re-run it on push and on
# demand to re-certify after a Bun or @duckdb/node-api version change.

name: certify-duckdb-bun

on:
  push:
    paths:
      - "package.json"
      - "bun.lock"
      - "packages/analytics/**"
      - ".github/workflows/certify-duckdb-bun.yml"
  workflow_dispatch:

concurrency:
  group: certify-duckdb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: certify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Verify platform
        run: |
          uname -m
          bun --version
          node --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DuckDB certification harness
        run: bun packages/analytics/test/certify-duckdb-bun.ts

      - name: Run existing compat gate
        run: bun packages/analytics/test/duckdb-bun-compat.ts

      - name: Run analytics test suite
        run: bun run test packages/analytics/